name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Only what the tested scripts import; training needs the full setup in the README.
      - run: python -m pip install numpy pillow
      - run: python -m unittest test_label test_capture
